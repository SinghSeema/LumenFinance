[project]
name = "emi-agent"
version = "0.1.0"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emi_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
